# Swarm CI Workflow
# Fast lane on PRs (lean build/test + trait compile checks); deep suite
# (full trait tests, showcase matrix, provider proofs) only on main
# pushes, tags, releases, or manual dispatch.

name: Swift CI

on:
  push:
    branches: [ "main", "fix/ci-code-quality" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS: lean default build + full Integrations matrix
  build-macos:
    name: Build & Test (macOS)
    # macos-15 is billed; this account's $0 Actions budget + failed
    # payment auth refuse to queue GitHub-hosted macOS jobs. Self-hosted
    # still runs the same steps and produces hosted job records.
    runs-on: [self-hosted, macOS]
    # Fail fast instead of burning hours when a test hangs.
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      # Use the runner Xcode toolchain only. setup-swift 6.2 on macos-15
      # can install 6.2.4 beside the image stdlib and crash tests with
      # "Symbol not found: EnumeratedSequence".
      - name: Show Swift version
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-xcode-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-xcode-

      # Cold lean proof + product-scoped build + omit-target lean tests.
      # Wipes .build/Package.resolved so cache cannot hide a cold resolve.
      - name: Lean resolve, build, and test
        run: bash scripts/ci/lean-build-test.sh

      - name: Build with Integrations trait
        run: |
          rm -rf .build Package.resolved
          swift package resolve
          bash scripts/ci/verify-lean-resolve.sh
          swift build --traits Integrations

      - name: Run tests with Integrations trait
        if: github.event_name != 'pull_request'
        timeout-minutes: 90
        run: swift test --no-parallel --traits Integrations,MCP,OpenTelemetry

      - name: Run capability showcase matrix
        if: github.event_name != 'pull_request'
        run: swift run --traits Integrations SwarmCapabilityShowcase matrix

      - name: Test CodeReviewer example
        if: github.event_name != 'pull_request'
        run: SWARM_CORE_ONLY=1 swift test
        working-directory: Examples/CodeReviewer

  # Linux: lean default + Integrations (including Hive)
  build-linux:
    name: Build (Linux Core)
    runs-on: ubuntu-latest
    # Fail fast instead of burning hours when a test hangs.
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      # Pin the exact toolchain version: setup-swift@v3 rejects a bare "6.2"
      # when the resolved download is 6.2.x ("requested: 6.2, actual: 6.2.4").
      - name: Setup Swift 6.2
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true

      - name: Verify Swift version
        run: swift --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: linux-swift-${{ hashFiles('Package.swift') }}
          restore-keys: |
            linux-swift-

      - name: Lean resolve, build, and test
        run: bash scripts/ci/lean-build-test.sh

      - name: Build with Integrations trait
        run: |
          rm -rf .build Package.resolved
          swift package resolve
          bash scripts/ci/verify-lean-resolve.sh
          swift build --traits Integrations

      - name: Build tests with Integrations trait
        run: swift build --build-tests --traits Integrations,MCP,OpenTelemetry

      - name: Run tests with Integrations trait
        if: github.event_name != 'pull_request'
        timeout-minutes: 90
        run: swift test --no-parallel --traits Integrations,MCP,OpenTelemetry

      - name: Linux OpenAI-compatible provider proof
        if: github.event_name != 'pull_request'
        run: swift test --no-parallel --filter OpenAICompatible

  # Opt-in live microphone proof. Not a merge gate. Does not record samples.
  voice-live:
    name: Voice live microphone (opt-in)
    if: ${{ vars.SWARM_VOICE_LIVE_MIC == '1' }}
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Show Swift version
        run: swift --version

      - name: Prepare Apple speech without capture
        env:
          SWARM_VOICE_LIVE_MIC: "1"
        run: SWARM_OMIT_INTEGRATION_TARGETS=1 swift test --filter SwarmTests.VoiceLiveMic

  # Code Quality (macOS only - SwiftLint/SwiftFormat)
  code-quality:
    name: Code Quality
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      # Pin SwiftLint by path. brew on self-hosted (and image drift) is
      # not the gate — the downloaded 0.62.2 binary is.
      - name: Install SwiftLint 0.62.2
        run: |
          curl -fsSL -o /tmp/swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.62.2/portable_swiftlint.zip
          unzip -o /tmp/swiftlint.zip -d /tmp/swiftlint-bin
          BIN="$(find /tmp/swiftlint-bin -type f -name swiftlint | head -n 1)"
          test -n "$BIN"
          chmod +x "$BIN"
          mkdir -p "$HOME/.local/bin"
          cp "$BIN" "$HOME/.local/bin/swiftlint"
          VERSION="$("$HOME/.local/bin/swiftlint" version)"
          echo "pinned SwiftLint $VERSION"
          test "$VERSION" = "0.62.2"

      - name: Run SwiftLint
        run: |
          "$HOME/.local/bin/swiftlint" lint --strict --config .swiftlint.yml Sources Tests

      # Pin SwiftFormat: brew / image latest enables wrap* and Swift Testing
      # name rules that this repo does not apply. Invoke the downloaded 0.58.7
      # binary by path so a newer brew swiftformat cannot win PATH.
      - name: Install SwiftFormat 0.58.7
        run: |
          curl -fsSL -o /tmp/swiftformat.zip \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.58.7/swiftformat.zip
          unzip -o /tmp/swiftformat.zip -d /tmp/swiftformat-bin
          BIN="$(find /tmp/swiftformat-bin -type f -name swiftformat | head -n 1)"
          test -n "$BIN"
          chmod +x "$BIN"
          mkdir -p "$HOME/.local/bin"
          cp "$BIN" "$HOME/.local/bin/swiftformat"
          VERSION="$("$HOME/.local/bin/swiftformat" --version)"
          echo "pinned SwiftFormat $VERSION"
          test "$VERSION" = "0.58.7"

      - name: Run SwiftFormat (check mode)
        run: |
          "$HOME/.local/bin/swiftformat" Sources Tests --lint --config .swiftformat
